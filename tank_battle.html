<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>坦克大战</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #070b16;
      --panel: rgba(15, 23, 42, 0.82);
      --panel-strong: rgba(15, 23, 42, 0.96);
      --line: rgba(148, 163, 184, 0.28);
      --text: #e5eefb;
      --muted: #91a4bd;
      --blue: #38bdf8;
      --green: #4ade80;
      --amber: #fbbf24;
      --red: #fb7185;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 18% 12%, rgba(56, 189, 248, 0.18), transparent 30%),
        radial-gradient(circle at 86% 8%, rgba(251, 191, 36, 0.13), transparent 26%),
        linear-gradient(180deg, #0a1020 0%, var(--bg) 100%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .app { width: min(96vw, 1040px); }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 12px;
    }
    .brand {
      display: grid;
      gap: 3px;
    }
    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 36px);
      line-height: 1;
      letter-spacing: 0;
    }
    .subtitle {
      color: var(--muted);
      font-size: 13px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(6, minmax(92px, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }
    .tag {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      min-height: 54px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .tag span:first-child {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 3px;
    }
    .tag strong {
      display: block;
      font-size: 20px;
      line-height: 1;
      color: #f8fafc;
    }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid rgba(125, 211, 252, 0.38);
      background: linear-gradient(180deg, rgba(37, 99, 235, 0.92), rgba(29, 78, 216, 0.92));
      color: #fff;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.24);
    }
    button.secondary {
      background: rgba(15, 23, 42, 0.9);
      border-color: var(--line);
      box-shadow: none;
    }
    .battlefield {
      display: grid;
      grid-template-columns: minmax(0, 832px) 188px;
      gap: 12px;
      align-items: start;
    }
    .canvas-wrap {
      position: relative;
      width: 100%;
      max-width: 832px;
    }
    canvas {
      width: 100%;
      max-width: 832px;
      aspect-ratio: 13 / 13;
      background: #0f172a;
      border: 1px solid rgba(148, 163, 184, 0.34);
      border-radius: 8px;
      display: block;
      touch-action: none;
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.42), 0 0 0 1px rgba(255, 255, 255, 0.04);
    }
    .overlay {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(3, 7, 18, 0.68);
      backdrop-filter: blur(2px);
      border-radius: 8px;
      text-align: center;
    }
    .overlay.show { display: grid; }
    .overlay-card {
      width: min(420px, 92%);
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: 0 24px 54px rgba(0, 0, 0, 0.38);
    }
    .overlay-card h2 {
      margin: 0 0 8px;
      font-size: 28px;
      letter-spacing: 0;
    }
    .overlay-card p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.5;
    }
    .side-panel {
      display: grid;
      gap: 10px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
    }
    .panel h2 {
      margin: 0 0 8px;
      font-size: 15px;
      letter-spacing: 0;
    }
    .controls {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }
    .buffs {
      color: var(--green);
      min-height: 18px;
      font-size: 13px;
      line-height: 1.45;
    }
    .status-line {
      color: var(--amber);
      font-weight: 700;
      min-height: 20px;
      line-height: 1.35;
    }
    .touch-ui {
      margin-top: 10px;
      display: none;
      justify-content: space-between;
      align-items: end;
      gap: 12px;
    }
    .joystick {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--line);
      position: relative;
      touch-action: none;
      box-shadow: inset 0 0 28px rgba(56, 189, 248, 0.1);
    }
    .stick {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(180deg, #475569, #1e293b);
      position: absolute;
      left: 38px;
      top: 38px;
      pointer-events: none;
    }
    .fire-btn {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 25%, #fecdd3, #dc2626 42%, #991b1b);
      border: 2px solid rgba(251, 113, 133, 0.9);
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      touch-action: none;
    }
    @media (max-width: 980px) {
      .battlefield { grid-template-columns: 1fr; }
      .side-panel { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      body { padding: 10px; }
      .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .side-panel { grid-template-columns: 1fr; }
      .touch-ui { display: flex; }
      .tag { min-height: 50px; padding: 7px 8px; }
      .tag strong { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="top">
      <div class="brand">
        <h1>坦克大战</h1>
        <div class="subtitle">守住基地，击毁全部敌军</div>
      </div>
      <div class="actions">
        <button id="startBtn">游戏开始</button>
        <button id="pauseBtn" class="secondary">暂停</button>
        <button id="restartBtn">重新开始</button>
      </div>
    </div>

    <div class="stats">
      <div class="tag"><span>关卡</span><strong id="level">1</strong></div>
      <div class="tag"><span>生命</span><strong id="lives">3</strong></div>
      <div class="tag"><span>得分</span><strong id="score">0</strong></div>
      <div class="tag"><span>最高分</span><strong id="bestScore">0</strong></div>
      <div class="tag"><span>击毁</span><strong id="kills">0</strong></div>
      <div class="tag"><span>剩余敌人</span><strong id="enemies">0</strong></div>
    </div>

    <div class="battlefield">
      <div class="canvas-wrap">
        <canvas id="game" width="832" height="832"></canvas>
        <div id="startOverlay" class="overlay show">
          <div class="overlay-card">
            <h2 id="overlayTitle">准备出击</h2>
            <p id="overlayText">方向键 / WASD 移动，空格射击。保护底部基地，清除全部敌人。</p>
            <button id="overlayAction">游戏开始</button>
          </div>
        </div>
      </div>
      <aside class="side-panel">
        <section class="panel">
          <h2>战场状态</h2>
          <div id="message" class="status-line"></div>
          <div id="buffs" class="buffs"></div>
        </section>
        <section class="panel">
          <h2>操作</h2>
          <div class="controls">
            <div>移动：方向键 / WASD</div>
            <div>射击：空格</div>
            <div>暂停：P</div>
            <div>手机：摇杆 + 开火键</div>
          </div>
        </section>
      </aside>
    </div>

    <div class="touch-ui">
      <div id="joystick" class="joystick"><div id="stick" class="stick"></div></div>
      <button id="fireBtn" class="fire-btn">开火</button>
    </div>
  </div>

  <script>
    const TILE = 32;
    const GRID = 26;
    const CANVAS_SIZE = TILE * GRID;
    const PLAYER_BASE_SPEED = 2.2;
    const ENEMY_BASE_SPEED = 1.35;
    const BULLET_SPEED = 5.8;
    const LEVELS = 3;
    const POWERUP_DURATION = 600; // frames ~10s
    const BEST_SCORE_KEY = "tankBattleBestScore";

    const COLORS = {
      bg: "#0b1220", grid: "#17233a", brick: "#b45309", steel: "#94a3b8", base: "#f59e0b",
      player: "#22c55e", enemy: "#ef4444", scout: "#f97316", heavy: "#c084fc",
      bullet: "#f8fafc", shield: "#60a5fa", speed: "#f59e0b", rapid: "#a855f7"
    };

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const levelEl = document.getElementById("level");
    const livesEl = document.getElementById("lives");
    const scoreEl = document.getElementById("score");
    const bestScoreEl = document.getElementById("bestScore");
    const killsEl = document.getElementById("kills");
    const enemiesEl = document.getElementById("enemies");
    const buffsEl = document.getElementById("buffs");
    const messageEl = document.getElementById("message");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const restartBtn = document.getElementById("restartBtn");
    const startOverlay = document.getElementById("startOverlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");
    const overlayAction = document.getElementById("overlayAction");
    const joystick = document.getElementById("joystick");
    const stick = document.getElementById("stick");
    const fireBtn = document.getElementById("fireBtn");

    let walls = [];
    let player = null;
    let enemies = [];
    let bullets = [];
    let powerups = [];
    let particles = [];
    let floatingTexts = [];
    let keys = {};
    let score = 0;
    let bestScore = Number(localStorage.getItem(BEST_SCORE_KEY) || 0);
    let lives = 3;
    let level = 1;
    let gameOver = false;
    let started = false;
    let paused = false;
    let spawnTimer = 0;
    let totalEnemyToSpawn = 12;
    let spawned = 0;
    let enemyKilled = 0;
    let frame = 0;
    let touchDir = null;
    let touchFire = false;

    const base = { x: 12 * TILE, y: 24 * TILE, w: TILE * 2, h: TILE * 2, alive: true };
    const playerEffects = { shieldUntil: 0, speedUntil: 0, rapidUntil: 0 };

    function rectsOverlap(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function makeTank(x, y, dir, type, kind = "standard") {
      const hp = kind === "heavy" ? 2 : 1;
      return { x, y, w: TILE, h: TILE, dir, type, kind, hp, cooldown: 0, aiTurnIn: 0 };
    }

    function addWall(tx, ty, kind) {
      walls.push({ x: tx * TILE, y: ty * TILE, w: TILE, h: TILE, kind });
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function canPlaceWall(tx, ty) {
      // Keep spawn lanes and base area clearer.
      if ((tx >= 11 && tx <= 14 && ty >= 22) || (tx >= 10 && tx <= 15 && ty >= 23)) return false;
      if (ty >= 20 && tx >= 10 && tx <= 15) return false;
      if ((ty <= 3 && (tx <= 4 || (tx >= 10 && tx <= 15) || tx >= 21))) return false;
      return true;
    }

    function addRandomWalls(brickCount, steelCount) {
      let attempts = 0;
      let brickLeft = brickCount;
      let steelLeft = steelCount;
      while ((brickLeft > 0 || steelLeft > 0) && attempts < 3000) {
        attempts++;
        const tx = randInt(2, 23);
        const ty = randInt(3, 21);
        if (!canPlaceWall(tx, ty)) continue;
        if (walls.some((w) => w.x === tx * TILE && w.y === ty * TILE)) continue;
        if (brickLeft > 0 && (steelLeft === 0 || Math.random() < 0.78)) {
          addWall(tx, ty, "brick");
          brickLeft--;
        } else if (steelLeft > 0) {
          addWall(tx, ty, "steel");
          steelLeft--;
        }
      }
    }

    function buildLevelMap(lv) {
      walls = [];
      for (let x = 0; x < GRID; x++) { addWall(x, 0, "steel"); addWall(x, GRID - 1, "steel"); }
      for (let y = 1; y < GRID - 1; y++) { addWall(0, y, "steel"); addWall(GRID - 1, y, "steel"); }

      // Randomized map blocks per level to keep each round fresh.
      if (lv === 1) addRandomWalls(46, 8);
      else if (lv === 2) addRandomWalls(58, 12);
      else addRandomWalls(68, 18);

      addWall(11, 23, "brick"); addWall(12, 23, "brick"); addWall(13, 23, "brick"); addWall(14, 23, "brick");
      addWall(11, 24, "brick"); addWall(14, 24, "brick");
      addWall(11, 25, "brick"); addWall(14, 25, "brick");
    }

    function setupLevel(resetScoreAndLives) {
      if (resetScoreAndLives) { score = 0; lives = 3; }
      buildLevelMap(level);
      player = makeTank(12 * TILE, 22 * TILE, "up", "player");
      enemies = [];
      bullets = [];
      powerups = [];
      particles = [];
      floatingTexts = [];
      spawned = 0;
      enemyKilled = 0;
      totalEnemyToSpawn = 7 + level * 3;
      spawnTimer = 80;
      base.alive = true;
      gameOver = false;
      messageEl.textContent = `第 ${level} 关开始`;
      updateUI();
    }

    function resetAll() {
      level = 1;
      frame = 0;
      paused = false;
      started = false;
      pauseBtn.textContent = "暂停";
      playerEffects.shieldUntil = 0;
      playerEffects.speedUntil = 0;
      playerEffects.rapidUntil = 0;
      setupLevel(true);
      showOverlay("准备出击", "方向键 / WASD 移动，空格射击。保护基地，清除全部敌人。", "游戏开始");
    }

    function updateUI() {
      levelEl.textContent = String(level);
      livesEl.textContent = String(lives);
      scoreEl.textContent = String(score);
      bestScoreEl.textContent = String(bestScore);
      killsEl.textContent = String(enemyKilled);
      enemiesEl.textContent = String(Math.max(0, totalEnemyToSpawn - enemyKilled));
      const buffs = [];
      if (playerEffects.shieldUntil > frame) buffs.push(`护盾 ${Math.ceil((playerEffects.shieldUntil - frame) / 60)}s`);
      if (playerEffects.speedUntil > frame) buffs.push(`加速 ${Math.ceil((playerEffects.speedUntil - frame) / 60)}s`);
      if (playerEffects.rapidUntil > frame) buffs.push(`连发 ${Math.ceil((playerEffects.rapidUntil - frame) / 60)}s`);
      buffsEl.textContent = buffs.length ? `当前道具：${buffs.join(" / ")}` : "当前道具：无";
    }

    function saveBestScore() {
      if (score <= bestScore) return;
      bestScore = score;
      localStorage.setItem(BEST_SCORE_KEY, String(bestScore));
      updateUI();
    }

    function showOverlay(title, text, actionText = "继续游戏") {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      overlayAction.textContent = actionText;
      startOverlay.classList.add("show");
    }

    function hideOverlay() {
      startOverlay.classList.remove("show");
    }

    function collidesTank(rect, ignoreTank) {
      if (rectsOverlap(rect, base) && base.alive) return true;
      for (const w of walls) if (rectsOverlap(rect, w)) return true;
      if (player && player !== ignoreTank && rectsOverlap(rect, player)) return true;
      for (const e of enemies) if (e !== ignoreTank && rectsOverlap(rect, e)) return true;
      return false;
    }

    function tankSpeed(tank) {
      if (tank.type !== "player") return tank.kind === "scout" ? ENEMY_BASE_SPEED * 1.28 : tank.kind === "heavy" ? ENEMY_BASE_SPEED * 0.78 : ENEMY_BASE_SPEED;
      return playerEffects.speedUntil > frame ? PLAYER_BASE_SPEED * 1.7 : PLAYER_BASE_SPEED;
    }

    function fireCooldown(tank) {
      if (tank.type !== "player") return tank.kind === "scout" ? 42 : tank.kind === "heavy" ? 52 : 34;
      return playerEffects.rapidUntil > frame ? 6 : 18;
    }

    function moveTank(tank, dir) {
      tank.dir = dir;
      const speed = tankSpeed(tank);
      const n = { x: tank.x, y: tank.y, w: tank.w, h: tank.h };
      if (dir === "up") n.y -= speed;
      if (dir === "down") n.y += speed;
      if (dir === "left") n.x -= speed;
      if (dir === "right") n.x += speed;
      if (n.x < TILE || n.y < TILE || n.x + TILE > CANVAS_SIZE - TILE || n.y + TILE > CANVAS_SIZE - TILE) return;
      if (!collidesTank(n, tank)) { tank.x = n.x; tank.y = n.y; }
    }

    function fire(tank) {
      if (tank.cooldown > 0) return;
      tank.cooldown = fireCooldown(tank);
      let bx = tank.x + tank.w / 2 - 4;
      let by = tank.y + tank.h / 2 - 4;
      if (tank.dir === "up") by = tank.y - 8;
      if (tank.dir === "down") by = tank.y + tank.h;
      if (tank.dir === "left") bx = tank.x - 8;
      if (tank.dir === "right") bx = tank.x + tank.w;
      bullets.push({ x: bx, y: by, w: 8, h: 8, dir: tank.dir, from: tank.type, trail: [] });
    }

    function spawnEnemy() {
      if (spawned >= totalEnemyToSpawn) return;
      const points = [{ x: 2 * TILE, y: 2 * TILE }, { x: 12 * TILE, y: 2 * TILE }, { x: 22 * TILE, y: 2 * TILE }];
      const p = points[Math.floor(Math.random() * points.length)];
      const roll = Math.random();
      const kind = level >= 3 && roll > 0.72 ? "heavy" : level >= 2 && roll > 0.5 ? "scout" : "standard";
      const e = makeTank(p.x, p.y, "down", "enemy", kind);
      if (!collidesTank(e)) { enemies.push(e); spawned++; }
    }

    function maybeDropPowerup(x, y) {
      if (Math.random() > 0.28) return;
      const types = ["shield", "speed", "rapid"];
      const type = types[Math.floor(Math.random() * types.length)];
      powerups.push({ x, y, w: TILE, h: TILE, type, ttl: 700 });
    }

    function applyPowerup(type) {
      if (type === "shield") playerEffects.shieldUntil = frame + POWERUP_DURATION;
      if (type === "speed") playerEffects.speedUntil = frame + POWERUP_DURATION;
      if (type === "rapid") playerEffects.rapidUntil = frame + POWERUP_DURATION;
      addFloatingText(player.x + TILE / 2, player.y, type === "shield" ? "护盾" : type === "speed" ? "加速" : "连发", COLORS.player);
      updateUI();
    }

    function addExplosion(x, y, color = "#fbbf24", count = 14) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.2 + Math.random() * 3.8;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 22 + Math.random() * 16,
          maxLife: 38,
          size: 2 + Math.random() * 4,
          color
        });
      }
    }

    function addFloatingText(x, y, text, color = "#f8fafc") {
      floatingTexts.push({ x, y, text, color, life: 54 });
    }

    function updatePlayer() {
      if (!player || gameOver) return;
      const moveDir = touchDir || (keys["ArrowUp"] || keys["w"] ? "up" :
        keys["ArrowDown"] || keys["s"] ? "down" :
        keys["ArrowLeft"] || keys["a"] ? "left" :
        keys["ArrowRight"] || keys["d"] ? "right" : null);
      if (moveDir) moveTank(player, moveDir);
      if (keys[" "] || touchFire) fire(player);
      if (player.cooldown > 0) player.cooldown--;
    }

    function updateEnemies() {
      for (const e of enemies) {
        if (e.cooldown > 0) e.cooldown--;
        e.aiTurnIn--;
        if (e.aiTurnIn <= 0) {
          const dirs = ["up", "down", "left", "right"];
          e.dir = dirs[Math.floor(Math.random() * 4)];
          e.aiTurnIn = 35 + Math.random() * 75;
          if (Math.random() < 0.62) fire(e);
        }
        moveTank(e, e.dir);
      }
    }

    function updatePowerups() {
      powerups = powerups.filter((p) => {
        p.ttl--;
        if (player && rectsOverlap(player, p)) { applyPowerup(p.type); return false; }
        return p.ttl > 0;
      });
    }

    function updateEffects() {
      particles = particles.filter((p) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.94;
        p.vy *= 0.94;
        p.life--;
        return p.life > 0;
      });
      floatingTexts = floatingTexts.filter((t) => {
        t.y -= 0.35;
        t.life--;
        return t.life > 0;
      });
    }

    function updateBullets() {
      const next = [];
      for (const b of bullets) {
        b.trail.push({ x: b.x + b.w / 2, y: b.y + b.h / 2 });
        if (b.trail.length > 5) b.trail.shift();
        if (b.dir === "up") b.y -= BULLET_SPEED;
        if (b.dir === "down") b.y += BULLET_SPEED;
        if (b.dir === "left") b.x -= BULLET_SPEED;
        if (b.dir === "right") b.x += BULLET_SPEED;
        if (b.x < 0 || b.y < 0 || b.x > CANVAS_SIZE || b.y > CANVAS_SIZE) continue;

        let hitWall = false;
        for (const w of walls) {
          if (rectsOverlap(b, w)) {
            if (w.kind === "brick") walls = walls.filter((x) => x !== w);
            addExplosion(b.x + 4, b.y + 4, w.kind === "brick" ? "#f59e0b" : "#cbd5e1", w.kind === "brick" ? 9 : 5);
            hitWall = true;
            break;
          }
        }
        if (hitWall) continue;

        if (base.alive && rectsOverlap(b, base)) {
          base.alive = false;
          gameOver = true;
          saveBestScore();
          messageEl.textContent = "基地被摧毁，游戏结束";
          addExplosion(base.x + base.w / 2, base.y + base.h / 2, "#fb7185", 34);
          showOverlay("基地失守", `本轮得分 ${score}，击毁 ${enemyKilled} 辆敌车。`, "重新开始");
          continue;
        }

        if (b.from === "player") {
          let killed = null;
          for (const e of enemies) if (rectsOverlap(b, e)) { killed = e; break; }
          if (killed) {
            killed.hp--;
            addExplosion(b.x + 4, b.y + 4, "#f8fafc", 6);
            if (killed.hp <= 0) {
              enemies = enemies.filter((x) => x !== killed);
              enemyKilled++;
              const gain = killed.kind === "heavy" ? 180 : killed.kind === "scout" ? 130 : 100;
              score += gain;
              saveBestScore();
              addExplosion(killed.x + TILE / 2, killed.y + TILE / 2, killed.kind === "heavy" ? COLORS.heavy : COLORS.enemy, 18);
              addFloatingText(killed.x + TILE / 2, killed.y, `+${gain}`, "#fbbf24");
              maybeDropPowerup(killed.x, killed.y);
            } else {
              addFloatingText(killed.x + TILE / 2, killed.y, "装甲受损", "#e9d5ff");
            }
            updateUI();
            continue;
          }
        } else if (player && rectsOverlap(b, player)) {
          if (playerEffects.shieldUntil > frame) continue;
          lives--;
          addExplosion(player.x + TILE / 2, player.y + TILE / 2, "#22c55e", 16);
          updateUI();
          if (lives <= 0) {
            gameOver = true;
            saveBestScore();
            messageEl.textContent = "你被击败，游戏结束";
            showOverlay("坦克损毁", `本轮得分 ${score}，击毁 ${enemyKilled} 辆敌车。`, "重新开始");
          } else {
            player.x = 12 * TILE; player.y = 22 * TILE; player.dir = "up";
            playerEffects.shieldUntil = frame + 150; // 短暂无敌
            addFloatingText(player.x + TILE / 2, player.y, "短暂无敌", COLORS.shield);
          }
          continue;
        }
        next.push(b);
      }
      bullets = next;
    }

    function checkProgress() {
      if (gameOver) return;
      if (enemyKilled >= totalEnemyToSpawn && enemies.length === 0) {
        if (level < LEVELS) {
          level++;
          setupLevel(false);
        } else {
          gameOver = true;
          saveBestScore();
          messageEl.textContent = "通关！你完成了全部关卡";
          showOverlay("任务完成", `最终得分 ${score}，最高分 ${bestScore}。`, "再来一局");
        }
      }
    }

    function roundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawTank(t, color) {
      const cx = t.x + t.w / 2;
      const cy = t.y + t.h / 2;
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = t.type === "player" ? 10 : 5;
      ctx.fillStyle = "#020617";
      roundedRect(t.x + 3, t.y + 4, 26, 24, 5);
      ctx.fill();
      ctx.fillStyle = color;
      roundedRect(t.x + 6, t.y + 3, 20, 26, 5);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(2, 6, 23, 0.65)";
      ctx.fillRect(t.x + 3, t.y + 8, 5, 16);
      ctx.fillRect(t.x + 24, t.y + 8, 5, 16);
      ctx.fillStyle = "#0b1020";
      ctx.beginPath();
      ctx.arc(cx, cy, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = color;
      if (t.dir === "up") roundedRect(cx - 3, t.y - 9, 6, 16, 3);
      if (t.dir === "down") roundedRect(cx - 3, t.y + t.h - 5, 6, 16, 3);
      if (t.dir === "left") roundedRect(t.x - 9, cy - 3, 16, 6, 3);
      if (t.dir === "right") roundedRect(t.x + t.w - 7, cy - 3, 16, 6, 3);
      ctx.fill();
      if (t.kind === "heavy") {
        ctx.strokeStyle = "#f5d0fe";
        ctx.lineWidth = 2;
        ctx.strokeRect(t.x + 7, t.y + 7, 18, 18);
      }
      if (t.type === "player" && playerEffects.shieldUntil > frame) {
        ctx.strokeStyle = COLORS.shield;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(cx, cy, 20 + Math.sin(frame / 8) * 2, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawPowerup(p) {
      const color = p.type === "shield" ? COLORS.shield : p.type === "speed" ? COLORS.speed : COLORS.rapid;
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = 12;
      ctx.fillStyle = color;
      roundedRect(p.x + 5, p.y + 5, TILE - 10, TILE - 10, 6);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#0b1020";
      const text = p.type === "shield" ? "盾" : p.type === "speed" ? "速" : "连";
      ctx.font = "bold 16px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText(text, p.x + TILE / 2, p.y + TILE / 2);
      ctx.restore();
    }

    function render() {
      const bg = ctx.createLinearGradient(0, 0, CANVAS_SIZE, CANVAS_SIZE);
      bg.addColorStop(0, "#101b33");
      bg.addColorStop(1, COLORS.bg);
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
      ctx.strokeStyle = COLORS.grid;
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID; i++) {
        ctx.beginPath(); ctx.moveTo(i * TILE, 0); ctx.lineTo(i * TILE, CANVAS_SIZE); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * TILE); ctx.lineTo(CANVAS_SIZE, i * TILE); ctx.stroke();
      }

      for (const w of walls) {
        ctx.fillStyle = w.kind === "brick" ? COLORS.brick : COLORS.steel;
        ctx.fillRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);
        ctx.fillStyle = w.kind === "brick" ? "rgba(254, 215, 170, 0.28)" : "rgba(248, 250, 252, 0.35)";
        ctx.fillRect(w.x + 4, w.y + 4, w.w - 8, 4);
        ctx.fillStyle = "rgba(2, 6, 23, 0.22)";
        ctx.fillRect(w.x + 4, w.y + w.h - 7, w.w - 8, 3);
      }

      if (base.alive) {
        ctx.save();
        ctx.shadowColor = COLORS.base;
        ctx.shadowBlur = 14;
        ctx.fillStyle = COLORS.base;
        roundedRect(base.x, base.y, base.w, base.h, 8);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#7c2d12";
        roundedRect(base.x + 12, base.y + 10, 40, 44, 5);
        ctx.fill();
        ctx.fillStyle = "#fde68a";
        ctx.font = "bold 18px sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("基地", base.x + base.w / 2, base.y + base.h / 2);
        ctx.restore();
      }

      for (const p of powerups) drawPowerup(p);
      if (player) drawTank(player, COLORS.player);
      for (const e of enemies) drawTank(e, e.kind === "heavy" ? COLORS.heavy : e.kind === "scout" ? COLORS.scout : COLORS.enemy);
      for (const b of bullets) {
        ctx.save();
        ctx.strokeStyle = b.from === "player" ? "rgba(125, 211, 252, 0.68)" : "rgba(251, 113, 133, 0.58)";
        ctx.lineWidth = 3;
        ctx.beginPath();
        b.trail.forEach((p, idx) => {
          if (idx === 0) ctx.moveTo(p.x, p.y);
          else ctx.lineTo(p.x, p.y);
        });
        ctx.stroke();
        ctx.shadowColor = b.from === "player" ? COLORS.bullet : "#fb7185";
        ctx.shadowBlur = 8;
        ctx.fillStyle = b.from === "player" ? COLORS.bullet : "#fecdd3";
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.restore();
      }
      for (const p of particles) {
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      ctx.font = "bold 16px sans-serif";
      ctx.textAlign = "center";
      for (const t of floatingTexts) {
        ctx.globalAlpha = Math.max(0, t.life / 54);
        ctx.fillStyle = t.color;
        ctx.fillText(t.text, t.x, t.y);
        ctx.globalAlpha = 1;
      }
    }

    function loop() {
      frame++;
      if (started && !gameOver && !paused) {
        spawnTimer--;
        if (spawnTimer <= 0) { spawnEnemy(); spawnTimer = Math.max(90, 140 - level * 10); }
        updatePlayer();
        updateEnemies();
        updateBullets();
        updatePowerups();
        if (frame % 20 === 0) updateUI();
        checkProgress();
      }
      updateEffects();
      render();
      requestAnimationFrame(loop);
    }

    function togglePause() {
      if (gameOver || !started) return;
      paused = !paused;
      pauseBtn.textContent = paused ? "继续" : "暂停";
      messageEl.textContent = paused ? "游戏已暂停" : "";
      if (paused) showOverlay("已暂停", "战场已冻结。点击继续游戏或按 P 返回。", "继续游戏");
      else hideOverlay();
    }

    function startOrResume() {
      if (gameOver) resetAll();
      started = true;
      paused = false;
      pauseBtn.textContent = "暂停";
      messageEl.textContent = `第 ${level} 关进行中`;
      hideOverlay();
    }

    function setStickByPointer(clientX, clientY) {
      const rect = joystick.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      let dx = clientX - cx;
      let dy = clientY - cy;
      const maxR = 34;
      const len = Math.hypot(dx, dy);
      if (len > maxR) { dx = (dx / len) * maxR; dy = (dy / len) * maxR; }
      stick.style.left = `${38 + dx}px`;
      stick.style.top = `${38 + dy}px`;
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) { touchDir = null; return; }
      touchDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up");
    }

    function resetStick() {
      touchDir = null;
      stick.style.left = "38px";
      stick.style.top = "38px";
    }

    window.addEventListener("keydown", (e) => {
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      if (k === "enter") { startOrResume(); return; }
      if (k === "p") { togglePause(); return; }
      keys[k] = true;
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(k)) e.preventDefault();
    });
    window.addEventListener("keyup", (e) => {
      const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
      keys[k] = false;
    });

    joystick.addEventListener("pointerdown", (e) => { joystick.setPointerCapture(e.pointerId); setStickByPointer(e.clientX, e.clientY); });
    joystick.addEventListener("pointermove", (e) => { if (e.pressure > 0) setStickByPointer(e.clientX, e.clientY); });
    joystick.addEventListener("pointerup", resetStick);
    joystick.addEventListener("pointercancel", resetStick);

    fireBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); touchFire = true; });
    fireBtn.addEventListener("pointerup", () => { touchFire = false; });
    fireBtn.addEventListener("pointercancel", () => { touchFire = false; });

    startBtn.addEventListener("click", startOrResume);
    overlayAction.addEventListener("click", startOrResume);
    pauseBtn.addEventListener("click", togglePause);
    restartBtn.addEventListener("click", resetAll);
    resetAll();
    loop();
  </script>
</body>
</html>
