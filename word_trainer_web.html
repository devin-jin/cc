<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>背单词拖拽版</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6fb;
      color: #22334d;
    }
    .app {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 16px 30px;
    }
    h1 {
      margin: 8px 0 18px;
      text-align: center;
      font-size: 26px;
    }
    .hint {
      text-align: center;
      color: #52627a;
      margin-bottom: 14px;
    }
    .toolbar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
      position: relative;
    }
    .menu-wrap {
      position: relative;
      display: inline-block;
    }
    .submenu {
      position: absolute;
      top: 44px;
      left: 0;
      min-width: 150px;
      background: #fff;
      border: 1px solid #d8deea;
      border-radius: 8px;
      padding: 6px;
      display: none;
      z-index: 10;
      box-shadow: 0 8px 18px rgba(24, 41, 72, 0.12);
    }
    .submenu button {
      width: 100%;
      margin: 4px 0;
      text-align: left;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      min-height: 460px;
    }
    ul {
      list-style: none;
      margin: 0;
      padding: 0;
      max-height: 380px;
      overflow: auto;
    }
    li {
      background: #ffffffcc;
      border: 1px solid #d8deea;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-size: 16px;
    }
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      border-radius: 12px;
      border: 1px solid #d8deea;
      background: #dfe6f2;
      padding: 10px;
    }
    .drop-label {
      position: absolute;
      top: 12px;
      font-size: 13px;
      color: #4c5d78;
    }
    .drop-left {
      left: 16px;
    }
    .drop-right {
      right: 16px;
    }
    .card {
      width: 220px;
      height: 130px;
      border-radius: 12px;
      background: #fff;
      border: 2px solid #2b3a55;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: 700;
      user-select: none;
      cursor: grab;
      touch-action: none;
      box-shadow: 0 10px 24px rgba(27, 42, 74, 0.18);
      transform: translate(0px, 0px);
      transition: transform 0.12s ease;
    }
    .card.dragging {
      cursor: grabbing;
      transition: none;
    }
    .progress {
      margin-top: 14px;
      font-size: 14px;
      color: #344761;
    }
    .actions {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      border: 1px solid #cfd8ea;
      border-radius: 8px;
      background: #fff;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover { background: #f9fbff; }
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 19, 38, 0.35);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 20;
    }
    .modal {
      width: min(560px, 100%);
      max-height: 80vh;
      border-radius: 12px;
      background: #fff;
      border: 1px solid #d8deea;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .modal-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid #e4e9f3;
      background: #f8faff;
    }
    .modal-head h3 {
      margin: 0;
      font-size: 18px;
    }
    .modal-body {
      padding: 12px;
      overflow: auto;
      max-height: calc(80vh - 56px);
    }
    .modal-empty {
      color: #5e708b;
      padding: 8px 4px;
    }
    @media (max-width: 940px) {
      ul { max-height: 220px; }
      .center { min-height: 280px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>背单词拖拽版</h1>
    <div class="hint">拖动中间卡片：向左放入“认识”，向右放入“不认识”</div>

    <div class="toolbar">
      <div class="menu-wrap">
        <button id="menuBtn">单词列表 ▾</button>
        <div class="submenu" id="submenu">
          <button id="openKnownBtn">认识列表</button>
          <button id="openUnknownBtn">不认识列表</button>
        </div>
      </div>
    </div>

    <div class="layout">
      <section class="center" id="dropArea">
        <div class="drop-label drop-left">← 认识</div>
        <div class="drop-label drop-right">不认识 →</div>
        <div class="card" id="wordCard">apple</div>
        <div class="progress" id="progressText"></div>
        <div class="actions">
          <button id="importCsvBtn">导入CSV</button>
          <button id="resetBtn">重置</button>
        </div>
      </section>
    </div>
  </div>
  <input id="csvInput" type="file" accept=".csv,text/csv" hidden />
  <div class="overlay" id="listOverlay">
    <div class="modal">
      <div class="modal-head">
        <h3 id="modalTitle">列表</h3>
        <button id="closeModalBtn">关闭</button>
      </div>
      <div class="modal-body">
        <ul id="modalList"></ul>
        <div class="modal-empty" id="modalEmpty">暂无单词</div>
      </div>
    </div>
  </div>

  <script>
    let words = [
      "apple", "banana", "orange", "school", "window",
      "garden", "future", "planet", "bridge", "memory"
    ];

    let currentIndex = 0;
    const knownWords = [];
    const unknownWords = [];

    const card = document.getElementById("wordCard");
    const progressText = document.getElementById("progressText");
    const resetBtn = document.getElementById("resetBtn");
    const menuBtn = document.getElementById("menuBtn");
    const submenu = document.getElementById("submenu");
    const openKnownBtn = document.getElementById("openKnownBtn");
    const openUnknownBtn = document.getElementById("openUnknownBtn");
    const listOverlay = document.getElementById("listOverlay");
    const modalTitle = document.getElementById("modalTitle");
    const modalList = document.getElementById("modalList");
    const modalEmpty = document.getElementById("modalEmpty");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const importCsvBtn = document.getElementById("importCsvBtn");
    const csvInput = document.getElementById("csvInput");

    let dragging = false;
    let startX = 0;
    let startY = 0;
    let dx = 0;
    let dy = 0;
    const threshold = 90;

    function render() {
      if (currentIndex >= words.length) {
        card.textContent = "完成!";
        progressText.textContent = `已完成：认识 ${knownWords.length} 个，不认识 ${unknownWords.length} 个`;
      } else {
        card.textContent = words[currentIndex];
        progressText.textContent = `进度：${currentIndex + 1} / ${words.length}`;
      }
    }

    function openListModal(type) {
      const data = type === "known" ? knownWords : unknownWords;
      modalTitle.textContent = type === "known" ? "认识列表" : "不认识列表";
      modalList.innerHTML = data.map((w) => `<li>${w}</li>`).join("");
      modalEmpty.style.display = data.length === 0 ? "block" : "none";
      listOverlay.style.display = "flex";
    }

    function closeListModal() {
      listOverlay.style.display = "none";
    }

    function resetCardPosition() {
      dx = 0;
      dy = 0;
      card.style.transform = "translate(0px, 0px)";
    }

    function startDrag(clientX, clientY) {
      if (currentIndex >= words.length) return;
      dragging = true;
      startX = clientX;
      startY = clientY;
      card.classList.add("dragging");
    }

    function moveDrag(clientX, clientY) {
      if (!dragging) return;
      dx = clientX - startX;
      dy = clientY - startY;
      card.style.transform = `translate(${dx}px, ${dy}px)`;
    }

    function endDrag() {
      if (!dragging) return;
      dragging = false;
      card.classList.remove("dragging");

      if (currentIndex >= words.length) {
        resetCardPosition();
        return;
      }

      const word = words[currentIndex];
      if (dx < -threshold) {
        knownWords.push(word);
        currentIndex += 1;
      } else if (dx > threshold) {
        unknownWords.push(word);
        currentIndex += 1;
      }
      resetCardPosition();
      render();
    }

    card.addEventListener("mousedown", (e) => startDrag(e.clientX, e.clientY));
    window.addEventListener("mousemove", (e) => moveDrag(e.clientX, e.clientY));
    window.addEventListener("mouseup", endDrag);

    card.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      startDrag(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener("touchmove", (e) => {
      const t = e.touches[0];
      if (!t) return;
      moveDrag(t.clientX, t.clientY);
    }, { passive: true });
    window.addEventListener("touchend", endDrag);

    resetBtn.addEventListener("click", () => {
      currentIndex = 0;
      knownWords.length = 0;
      unknownWords.length = 0;
      resetCardPosition();
      render();
    });

    menuBtn.addEventListener("click", () => {
      submenu.style.display = submenu.style.display === "block" ? "none" : "block";
    });
    openKnownBtn.addEventListener("click", () => {
      submenu.style.display = "none";
      openListModal("known");
    });
    openUnknownBtn.addEventListener("click", () => {
      submenu.style.display = "none";
      openListModal("unknown");
    });
    closeModalBtn.addEventListener("click", closeListModal);
    listOverlay.addEventListener("click", (e) => {
      if (e.target === listOverlay) closeListModal();
    });
    window.addEventListener("click", (e) => {
      if (!e.target.closest(".menu-wrap")) submenu.style.display = "none";
    });

    importCsvBtn.addEventListener("click", () => csvInput.click());
    csvInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        const text = String(reader.result || "");
        const imported = text
          .split(/\r?\n/)
          .flatMap((line) => line.split(","))
          .map((item) => item.trim().replace(/^"|"$/g, ""))
          .filter(Boolean);

        if (imported.length === 0) {
          alert("CSV 中没有读取到单词。");
          return;
        }

        words = imported;
        currentIndex = 0;
        knownWords.length = 0;
        unknownWords.length = 0;
        resetCardPosition();
        render();
        alert(`导入成功：共 ${words.length} 个单词`);
      };
      reader.readAsText(file, "utf-8");
      e.target.value = "";
    });

    render();
  </script>
</body>
</html>
