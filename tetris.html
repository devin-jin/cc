<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>俄罗斯方块</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0b1020;
      --panel: #151d33;
      --line: #2a3656;
      --text: #e9f0fb;
      --muted: #98a8c2;
      --accent: #38bdf8;
      --good: #4ade80;
      --warn: #fbbf24;
      --danger: #fb7185;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(circle at 18% 10%, rgba(56, 189, 248, 0.2), transparent 28%),
        radial-gradient(circle at 84% 20%, rgba(251, 191, 36, 0.15), transparent 25%),
        linear-gradient(180deg, #111827 0%, var(--bg) 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 16px;
    }
    .app {
      width: min(100%, 980px);
    }
    .top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1;
      letter-spacing: 0;
    }
    .subtitle {
      color: var(--muted);
      margin-top: 7px;
      font-size: 14px;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    button {
      border: 1px solid rgba(125, 211, 252, 0.42);
      border-radius: 8px;
      background: linear-gradient(180deg, #2563eb, #1d4ed8);
      color: #fff;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button.secondary {
      background: #111827;
      border-color: var(--line);
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 360px) minmax(220px, 1fr);
      gap: 14px;
      align-items: start;
    }
    .board-shell {
      position: relative;
      width: min(100%, 340px);
      justify-self: center;
      background: rgba(15, 23, 42, 0.84);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 22px 42px rgba(0, 0, 0, 0.36);
    }
    canvas {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 2;
      background: #08111f;
      border-radius: 6px;
      touch-action: none;
    }
    .overlay {
      position: absolute;
      inset: 10px;
      display: none;
      place-items: center;
      padding: 18px;
      background: rgba(3, 7, 18, 0.72);
      border-radius: 6px;
      text-align: center;
    }
    .overlay.show { display: grid; }
    .overlay-card {
      width: min(340px, 92%);
      background: rgba(17, 24, 39, 0.96);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
    }
    .overlay-card h2 {
      margin: 0 0 8px;
      font-size: 26px;
      letter-spacing: 0;
    }
    .overlay-card p {
      margin: 0 0 14px;
      color: var(--muted);
      line-height: 1.5;
    }
    .side {
      display: grid;
      gap: 12px;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .stat, .panel {
      background: rgba(15, 23, 42, 0.84);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
    }
    .stat span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 4px;
    }
    .stat strong {
      display: block;
      font-size: 24px;
      line-height: 1;
    }
    .panel h2 {
      margin: 0 0 8px;
      font-size: 16px;
      letter-spacing: 0;
    }
    .next-wrap {
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
    }
    #nextCanvas {
      width: 104px;
      height: 104px;
      background: #0a1324;
      border: 1px solid var(--line);
      border-radius: 6px;
    }
    .tips {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.45;
    }
    .status {
      color: var(--warn);
      font-weight: 700;
      min-height: 20px;
    }
    @media (max-width: 760px) {
      body { padding: 10px; }
      .layout { grid-template-columns: 1fr; }
      .side { order: -1; }
      .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .stat { padding: 8px; }
      .stat strong { font-size: 18px; }
      .next-wrap { grid-template-columns: 88px minmax(0, 1fr); }
      #nextCanvas { width: 88px; height: 88px; }
    }
    @media (max-width: 460px) {
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="top">
      <div>
        <h1>俄罗斯方块</h1>
        <div class="subtitle">堆叠、消行、提速，尽量坚持更久</div>
      </div>
      <div class="actions">
        <button id="startBtn">开始游戏</button>
        <button id="pauseBtn" class="secondary">暂停</button>
        <button id="restartBtn">重新开始</button>
      </div>
    </div>

    <div class="layout">
      <div class="board-shell">
        <canvas id="board" width="300" height="600" aria-label="俄罗斯方块游戏棋盘"></canvas>
        <div id="overlay" class="overlay show">
          <div class="overlay-card">
            <h2 id="overlayTitle">准备开始</h2>
            <p id="overlayText">方向键或 WASD 移动和旋转，空格硬降，P 暂停。</p>
            <button id="overlayAction">开始游戏</button>
          </div>
        </div>
      </div>

      <aside class="side">
        <section class="stats" aria-label="游戏数据">
          <div class="stat"><span>得分</span><strong id="score">0</strong></div>
          <div class="stat"><span>最高分</span><strong id="best">0</strong></div>
          <div class="stat"><span>等级</span><strong id="level">1</strong></div>
          <div class="stat"><span>行数</span><strong id="lines">0</strong></div>
        </section>

        <section class="panel">
          <h2>下一个</h2>
          <div class="next-wrap">
            <canvas id="nextCanvas" width="104" height="104" aria-label="下一个方块"></canvas>
            <div>
              <div id="status" class="status">等待开始</div>
              <div class="tips">每消 10 行提升 1 级，下落速度会逐级加快。</div>
            </div>
          </div>
        </section>

        <section class="panel">
          <h2>操作</h2>
          <div class="tips">
            <div>左/右：移动</div>
            <div>上 / W：旋转</div>
            <div>下 / S：软降</div>
            <div>触屏下滑：硬降</div>
            <div>空格：硬降</div>
            <div>P：暂停</div>
          </div>
        </section>
      </aside>
    </div>
  </main>

  <script>
    const COLS = 10;
    const ROWS = 20;
    const CELL = 30;
    const BEST_KEY = "tetrisBestScore";
    const COLORS = {
      I: "#22d3ee",
      J: "#60a5fa",
      L: "#fb923c",
      O: "#facc15",
      S: "#4ade80",
      T: "#c084fc",
      Z: "#fb7185"
    };
    const SHAPES = {
      I: [[1, 1, 1, 1]],
      J: [[1, 0, 0], [1, 1, 1]],
      L: [[0, 0, 1], [1, 1, 1]],
      O: [[1, 1], [1, 1]],
      S: [[0, 1, 1], [1, 1, 0]],
      T: [[0, 1, 0], [1, 1, 1]],
      Z: [[1, 1, 0], [0, 1, 1]]
    };
    const TYPES = Object.keys(SHAPES);

    const canvas = document.getElementById("board");
    const ctx = canvas.getContext("2d");
    const nextCanvas = document.getElementById("nextCanvas");
    const nextCtx = nextCanvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const levelEl = document.getElementById("level");
    const linesEl = document.getElementById("lines");
    const statusEl = document.getElementById("status");
    const overlay = document.getElementById("overlay");
    const overlayTitle = document.getElementById("overlayTitle");
    const overlayText = document.getElementById("overlayText");
    const overlayAction = document.getElementById("overlayAction");
    const startBtn = document.getElementById("startBtn");
    const pauseBtn = document.getElementById("pauseBtn");
    const restartBtn = document.getElementById("restartBtn");

    let board = [];
    let current = null;
    let next = null;
    let score = 0;
    let best = Number(localStorage.getItem(BEST_KEY) || 0);
    let lines = 0;
    let level = 1;
    let running = false;
    let paused = false;
    let gameOver = false;
    let lastTime = 0;
    let dropCounter = 0;
    let clearFlash = [];
    let swipeStart = null;

    function createBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(""));
    }

    function cloneShape(shape) {
      return shape.map((row) => [...row]);
    }

    function randomPiece() {
      const type = TYPES[Math.floor(Math.random() * TYPES.length)];
      const matrix = cloneShape(SHAPES[type]);
      return {
        type,
        matrix,
        x: Math.floor((COLS - matrix[0].length) / 2),
        y: 0
      };
    }

    function dropInterval() {
      return Math.max(110, 820 - (level - 1) * 70);
    }

    function updateUI() {
      scoreEl.textContent = String(score);
      bestEl.textContent = String(best);
      levelEl.textContent = String(level);
      linesEl.textContent = String(lines);
    }

    function showOverlay(title, text, actionText) {
      overlayTitle.textContent = title;
      overlayText.textContent = text;
      overlayAction.textContent = actionText;
      overlay.classList.add("show");
    }

    function hideOverlay() {
      overlay.classList.remove("show");
    }

    function collides(piece, offsetX = 0, offsetY = 0, matrix = piece.matrix) {
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < matrix[y].length; x++) {
          if (!matrix[y][x]) continue;
          const nx = piece.x + x + offsetX;
          const ny = piece.y + y + offsetY;
          if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
          if (ny >= 0 && board[ny][nx]) return true;
        }
      }
      return false;
    }

    function mergePiece() {
      current.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value) {
            const by = current.y + y;
            const bx = current.x + x;
            if (by >= 0) board[by][bx] = current.type;
          }
        });
      });
    }

    function rotateMatrix(matrix) {
      return matrix[0].map((_, x) => matrix.map((row) => row[x]).reverse());
    }

    function rotatePiece() {
      if (!running || paused || gameOver) return;
      const rotated = rotateMatrix(current.matrix);
      const kicks = [0, -1, 1, -2, 2];
      for (const kick of kicks) {
        if (!collides(current, kick, 0, rotated)) {
          current.x += kick;
          current.matrix = rotated;
          draw();
          return;
        }
      }
    }

    function movePiece(dir) {
      if (!running || paused || gameOver) return;
      if (!collides(current, dir, 0)) {
        current.x += dir;
        draw();
      }
    }

    function softDrop() {
      if (!running || paused || gameOver) return;
      if (!collides(current, 0, 1)) {
        current.y++;
        score += 1;
      } else {
        lockPiece();
      }
      dropCounter = 0;
      updateUI();
      draw();
    }

    function hardDrop() {
      if (!running || paused || gameOver) return;
      let distance = 0;
      while (!collides(current, 0, 1)) {
        current.y++;
        distance++;
      }
      score += distance * 2;
      lockPiece();
      updateUI();
      draw();
    }

    function clearLines() {
      const fullRows = [];
      board.forEach((row, index) => {
        if (row.every(Boolean)) fullRows.push(index);
      });
      if (!fullRows.length) return;
      clearFlash = fullRows;
      board = board.filter((_, index) => !fullRows.includes(index));
      while (board.length < ROWS) board.unshift(Array(COLS).fill(""));
      const lineScores = [0, 100, 300, 500, 800];
      lines += fullRows.length;
      level = Math.floor(lines / 10) + 1;
      score += lineScores[fullRows.length] * level;
      if (score > best) {
        best = score;
        localStorage.setItem(BEST_KEY, String(best));
      }
      statusEl.textContent = fullRows.length === 4 ? "四行消除!" : `消除 ${fullRows.length} 行`;
      setTimeout(() => {
        clearFlash = [];
        draw();
      }, 120);
    }

    function spawnPiece() {
      current = next || randomPiece();
      next = randomPiece();
      current.x = Math.floor((COLS - current.matrix[0].length) / 2);
      current.y = 0;
      if (collides(current)) {
        gameOver = true;
        running = false;
        statusEl.textContent = "游戏结束";
        showOverlay("游戏结束", `本局得分 ${score}，共消除 ${lines} 行。`, "再来一局");
      }
      drawNext();
    }

    function lockPiece() {
      mergePiece();
      clearLines();
      spawnPiece();
    }

    function resetGame() {
      board = createBoard();
      current = null;
      next = randomPiece();
      score = 0;
      lines = 0;
      level = 1;
      running = false;
      paused = false;
      gameOver = false;
      dropCounter = 0;
      statusEl.textContent = "等待开始";
      pauseBtn.textContent = "暂停";
      updateUI();
      spawnPiece();
      showOverlay("准备开始", "方向键或 WASD 移动和旋转，空格硬降，P 暂停。", "开始游戏");
      draw();
    }

    function startGame() {
      if (gameOver) resetGame();
      running = true;
      paused = false;
      pauseBtn.textContent = "暂停";
      statusEl.textContent = "游戏进行中";
      hideOverlay();
    }

    function togglePause() {
      if (!running || gameOver) return;
      paused = !paused;
      pauseBtn.textContent = paused ? "继续" : "暂停";
      if (paused) {
        statusEl.textContent = "已暂停";
        showOverlay("已暂停", "点击继续或按 P 返回游戏。", "继续");
      } else {
        statusEl.textContent = "游戏进行中";
        hideOverlay();
      }
    }

    function drawCell(context, x, y, size, type, alpha = 1) {
      if (!type) return;
      context.save();
      context.globalAlpha = alpha;
      context.fillStyle = COLORS[type];
      context.fillRect(x + 1, y + 1, size - 2, size - 2);
      context.fillStyle = "rgba(255,255,255,0.28)";
      context.fillRect(x + 3, y + 3, size - 6, 4);
      context.fillStyle = "rgba(2,6,23,0.22)";
      context.fillRect(x + 3, y + size - 7, size - 6, 4);
      context.strokeStyle = "rgba(255,255,255,0.25)";
      context.strokeRect(x + 1.5, y + 1.5, size - 3, size - 3);
      context.restore();
    }

    function drawGrid() {
      ctx.fillStyle = "#08111f";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "rgba(148,163,184,0.12)";
      ctx.lineWidth = 1;
      for (let x = 0; x <= COLS; x++) {
        ctx.beginPath();
        ctx.moveTo(x * CELL, 0);
        ctx.lineTo(x * CELL, ROWS * CELL);
        ctx.stroke();
      }
      for (let y = 0; y <= ROWS; y++) {
        ctx.beginPath();
        ctx.moveTo(0, y * CELL);
        ctx.lineTo(COLS * CELL, y * CELL);
        ctx.stroke();
      }
    }

    function ghostY() {
      let y = current.y;
      while (!collides({ ...current, y }, 0, 1)) y++;
      return y;
    }

    function draw() {
      drawGrid();
      board.forEach((row, y) => {
        row.forEach((type, x) => {
          drawCell(ctx, x * CELL, y * CELL, CELL, type);
        });
      });
      clearFlash.forEach((row) => {
        ctx.fillStyle = "rgba(248,250,252,0.28)";
        ctx.fillRect(0, row * CELL, COLS * CELL, CELL);
      });
      if (current) {
        const gy = ghostY();
        current.matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value) drawCell(ctx, (current.x + x) * CELL, (gy + y) * CELL, CELL, current.type, 0.22);
          });
        });
        current.matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value) drawCell(ctx, (current.x + x) * CELL, (current.y + y) * CELL, CELL, current.type);
          });
        });
      }
    }

    function drawNext() {
      nextCtx.fillStyle = "#0a1324";
      nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
      if (!next) return;
      const size = 22;
      const offsetX = (nextCanvas.width - next.matrix[0].length * size) / 2;
      const offsetY = (nextCanvas.height - next.matrix.length * size) / 2;
      next.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value) drawCell(nextCtx, offsetX + x * size, offsetY + y * size, size, next.type);
        });
      });
    }

    function loop(time = 0) {
      const delta = time - lastTime;
      lastTime = time;
      if (running && !paused && !gameOver) {
        dropCounter += delta;
        if (dropCounter > dropInterval()) {
          softDrop();
        }
      }
      requestAnimationFrame(loop);
    }

    function handleKey(key) {
      if (key === "ArrowLeft" || key === "a") movePiece(-1);
      if (key === "ArrowRight" || key === "d") movePiece(1);
      if (key === "ArrowDown" || key === "s") softDrop();
      if (key === "ArrowUp" || key === "w") rotatePiece();
      if (key === " ") hardDrop();
      if (key === "p") togglePause();
      if (key === "Enter") startGame();
    }

    window.addEventListener("keydown", (event) => {
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      if (["ArrowLeft", "ArrowRight", "ArrowDown", "ArrowUp", " ", "w", "a", "s", "d"].includes(key)) {
        event.preventDefault();
      }
      handleKey(key);
    });

    canvas.addEventListener("pointerdown", (event) => {
      swipeStart = { x: event.clientX, y: event.clientY };
    });
    canvas.addEventListener("pointerup", (event) => {
      if (!swipeStart) return;
      const dx = event.clientX - swipeStart.x;
      const dy = event.clientY - swipeStart.y;
      swipeStart = null;
      if (Math.abs(dx) < 18 && Math.abs(dy) < 18) return rotatePiece();
      if (Math.abs(dx) > Math.abs(dy)) movePiece(dx > 0 ? 1 : -1);
      else if (dy > 0) hardDrop();
      else rotatePiece();
    });

    startBtn.addEventListener("click", startGame);
    overlayAction.addEventListener("click", startGame);
    pauseBtn.addEventListener("click", togglePause);
    restartBtn.addEventListener("click", resetGame);

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
