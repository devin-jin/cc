<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>舒尔特方格训练</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f4f6fb;
      color: #1f2d3d;
    }
    .app {
      max-width: 980px;
      margin: 0 auto;
      padding: 12px 16px 16px;
    }
    h1 {
      text-align: center;
      margin: 2px 0 6px;
      font-size: 30px;
    }
    .desc {
      text-align: center;
      color: #4c5d78;
      margin: 0 0 8px;
    }
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }
    .panel {
      background: #fff;
      border: 1px solid #d7dfed;
      border-radius: 12px;
      padding: 8px 10px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    select, button {
      border: 1px solid #cfd9eb;
      border-radius: 8px;
      background: #fff;
      padding: 8px 10px;
      font-size: 14px;
    }
    button {
      cursor: pointer;
    }
    button:hover {
      background: #f8fbff;
    }
    .info-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }
    .status, .records {
      text-align: center;
      margin: 0;
      color: #32445e;
      font-size: 15px;
      background: #fff;
      border: 1px solid #d7dfed;
      border-radius: 10px;
      padding: 8px 10px;
    }
    .grid-wrap {
      display: flex;
      justify-content: center;
    }
    .grid {
      width: min(95vmin, calc(100vw - 44px), 700px);
      height: min(95vmin, calc(100vw - 44px), 700px);
      background: #dfe7f5;
      border: 2px solid #b9c7df;
      border-radius: 12px;
      padding: 6px;
      display: grid;
      gap: 5px;
      user-select: none;
      overflow: hidden;
    }
    .cell {
      border: 1px solid #afbdd5;
      border-radius: 8px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 42px;
      color: #24374f;
      cursor: pointer;
      transition: transform 0.08s ease, background 0.15s ease;
    }
    .cell:hover {
      transform: translateY(-1px);
      background: #f6f9ff;
    }
    .cell.error {
      background: #fff0ef;
      color: #b52e28;
      border-color: #efb7b3;
    }
    .cell.done {
      background: #e8f8ef;
      color: #1a7a3e;
      border-color: #a8d6bb;
    }
    .grid.hide-numbers .cell {
      color: transparent;
    }
    .screen-overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 20, 40, 0.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 30;
      pointer-events: none;
    }
    #recordsOverlay {
      pointer-events: auto;
    }
    .screen-overlay.show {
      display: flex;
    }
    .overlay-content {
      color: #fff;
      text-align: center;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
    }
    .overlay-main {
      font-size: clamp(56px, 14vw, 130px);
      line-height: 1.1;
    }
    .overlay-sub {
      margin-top: 8px;
      font-size: clamp(18px, 3vw, 30px);
      font-weight: 600;
    }
    .tips {
      margin: 8px auto 0;
      max-width: 660px;
      color: #556985;
      font-size: 13px;
      line-height: 1.55;
    }
    @media (max-width: 900px) {
      .info-row {
        grid-template-columns: 1fr;
      }
      .grid {
        width: min(calc(100vw - 36px), 640px);
        height: min(calc(100vw - 36px), 640px);
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>舒尔特方格</h1>
    <p class="desc">按从小到大顺序点击数字（1 → N²），用时越短说明注意力越集中</p>

    <div class="toolbar">
      <div class="panel">
        <label for="sizeSelect">方格大小</label>
        <select id="sizeSelect">
          <option value="3">3 x 3</option>
          <option value="4">4 x 4</option>
          <option value="5" selected>5 x 5</option>
          <option value="6">6 x 6</option>
          <option value="7">7 x 7</option>
        </select>
      </div>
      <button id="newBtn">重新生成</button>
      <button id="restartBtn">重置本轮</button>
      <button id="showRecordsBtn">历史成绩列表</button>
      <button id="clearRecordsBtn">清空成绩</button>
    </div>

    <div class="info-row">
      <div class="status" id="statusText">准备开始：请点击数字 1</div>
      <div class="status" id="timeText">计时：0.00 秒</div>
      <div class="records" id="recordText">历史成绩：暂无记录</div>
    </div>

    <div class="grid-wrap">
      <div id="grid" class="grid"></div>
    </div>

    <div class="tips">
      说明：每轮会先进行 <strong>3 秒倒计时</strong>，结束后计时自动开始。必须按顺序点击，点击错误数字会短暂高亮提示，但不会终止本轮训练。
    </div>
  </div>
  <div id="screenOverlay" class="screen-overlay">
    <div class="overlay-content">
      <div id="overlayMain" class="overlay-main"></div>
      <div id="overlaySub" class="overlay-sub"></div>
    </div>
  </div>
  <div id="recordsOverlay" class="screen-overlay">
    <div class="overlay-content" style="width:min(560px,90vw);background:#fff;color:#22334d;border-radius:12px;padding:14px 12px;text-shadow:none;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div id="recordsTitle" style="font-size:22px;font-weight:700;">历史成绩列表</div>
        <button id="closeRecordsBtn">关闭</button>
      </div>
      <div id="recordsBody" style="max-height:52vh;overflow:auto;text-align:left;"></div>
    </div>
  </div>

  <script>
    const sizeSelect = document.getElementById("sizeSelect");
    const newBtn = document.getElementById("newBtn");
    const restartBtn = document.getElementById("restartBtn");
    const showRecordsBtn = document.getElementById("showRecordsBtn");
    const clearRecordsBtn = document.getElementById("clearRecordsBtn");
    const statusText = document.getElementById("statusText");
    const timeText = document.getElementById("timeText");
    const recordText = document.getElementById("recordText");
    const grid = document.getElementById("grid");
    const screenOverlay = document.getElementById("screenOverlay");
    const overlayMain = document.getElementById("overlayMain");
    const overlaySub = document.getElementById("overlaySub");
    const recordsOverlay = document.getElementById("recordsOverlay");
    const recordsTitle = document.getElementById("recordsTitle");
    const recordsBody = document.getElementById("recordsBody");
    const closeRecordsBtn = document.getElementById("closeRecordsBtn");

    let size = Number(sizeSelect.value);
    let numbers = [];
    let nextTarget = 1;
    let startAt = 0;
    let timer = null;
    let countDownTimer = null;
    let overlayTimer = null;
    let canClick = false;
    let records = [];
    let lastDoneCell = null;
    const STORAGE_KEY = "schulteGridRecords";

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function buildNumbers() {
      const total = size * size;
      numbers = Array.from({ length: total }, (_, i) => i + 1);
      shuffle(numbers);
    }

    function clearTimer() {
      if (timer) {
        clearInterval(timer);
        timer = null;
      }
    }

    function clearCountDownTimer() {
      if (countDownTimer) {
        clearInterval(countDownTimer);
        countDownTimer = null;
      }
    }

    function clearOverlayTimer() {
      if (overlayTimer) {
        clearTimeout(overlayTimer);
        overlayTimer = null;
      }
    }

    function formatSeconds(ms) {
      return (ms / 1000).toFixed(2);
    }

    function startTimer() {
      startAt = Date.now();
      timer = setInterval(() => {
        timeText.textContent = `计时：${formatSeconds(Date.now() - startAt)} 秒`;
      }, 30);
    }

    function stopTimer() {
      clearTimer();
    }

    function showOverlay(mainText, subText = "", autoHideMs = 0) {
      overlayMain.textContent = mainText;
      overlaySub.textContent = subText;
      screenOverlay.classList.add("show");
      clearOverlayTimer();
      if (autoHideMs > 0) {
        overlayTimer = setTimeout(() => {
          hideOverlay();
        }, autoHideMs);
      }
    }

    function hideOverlay() {
      screenOverlay.classList.remove("show");
      clearOverlayTimer();
    }

    function openRecordsOverlay() {
      recordsTitle.textContent = `历史成绩列表（${size}x${size}）`;
      if (records.length === 0) {
        recordsBody.innerHTML = "<div style='color:#5a6b84;padding:6px 2px;'>暂无成绩记录</div>";
      } else {
        const sorted = [...records].sort((a, b) => a - b);
        recordsBody.innerHTML = sorted
          .map((ms, idx) => `<div style="padding:7px 4px;border-bottom:1px solid #e8edf6;">第 ${idx + 1} 名：${formatSeconds(ms)} 秒</div>`)
          .join("");
      }
      recordsOverlay.classList.add("show");
    }

    function closeRecordsOverlay() {
      recordsOverlay.classList.remove("show");
    }

    function loadRecords() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        const key = String(size);
        const items = Array.isArray(parsed[key]) ? parsed[key] : [];
        records = items.filter((v) => Number.isFinite(v));
      } catch (_) {
        records = [];
      }
    }

    function saveRecords() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : {};
        parsed[String(size)] = records;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
      } catch (_) {
        // Ignore storage write errors.
      }
    }

    function updateRecordText() {
      if (records.length === 0) {
        recordText.textContent = "历史成绩：暂无记录";
        return;
      }
      const best = Math.min(...records);
      const avg = records.reduce((s, n) => s + n, 0) / records.length;
      recordText.textContent = `历史成绩（${size}x${size}）：最好 ${formatSeconds(best)} 秒，平均 ${formatSeconds(avg)} 秒，共 ${records.length} 次`;
    }

    function renderGrid() {
      grid.innerHTML = "";
      grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${size}, 1fr)`;

      numbers.forEach((num) => {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "cell";
        cell.textContent = String(num);
        cell.dataset.value = String(num);
        cell.addEventListener("click", () => onCellClick(cell, num));
        grid.appendChild(cell);
      });
    }

    function updateStatus() {
      const max = size * size;
      if (nextTarget > max) return;
      statusText.textContent = `请点击：${nextTarget}`;
    }

    function markError(cell) {
      cell.classList.add("error");
      setTimeout(() => {
        cell.classList.remove("error");
      }, 220);
    }

    function onCellClick(cell, num) {
      const max = size * size;
      if (!canClick) return;
      if (nextTarget > max) return;
      if (cell.dataset.locked === "1") return;

      if (num !== nextTarget) {
        markError(cell);
        return;
      }

      cell.dataset.locked = "1";
      cell.style.cursor = "default";
      if (lastDoneCell) {
        lastDoneCell.classList.remove("done");
      }
      cell.classList.add("done");
      lastDoneCell = cell;
      nextTarget += 1;

      if (nextTarget > max) {
        canClick = false;
        stopTimer();
        const cost = Date.now() - startAt;
        records.push(cost);
        saveRecords();
        updateRecordText();
        statusText.textContent = `完成! 总用时：${formatSeconds(cost)} 秒`;
        showOverlay(`${formatSeconds(cost)} 秒`, "本轮完成");
      } else {
        updateStatus();
      }
    }

    function startCountDown() {
      clearCountDownTimer();
      hideOverlay();
      canClick = false;
      grid.classList.add("hide-numbers");
      let remain = 3;
      statusText.textContent = `准备开始：${remain}`;
      showOverlay(String(remain), "准备开始");
      countDownTimer = setInterval(() => {
        remain -= 1;
        if (remain > 0) {
          statusText.textContent = `准备开始：${remain}`;
          showOverlay(String(remain), "准备开始");
          return;
        }
        clearCountDownTimer();
        statusText.textContent = "开始！请点击：1";
        grid.classList.remove("hide-numbers");
        showOverlay("开始", "", 500);
        canClick = true;
        startTimer();
      }, 1000);
    }

    function initRound(regenerate) {
      clearTimer();
      clearCountDownTimer();
      hideOverlay();
      size = Number(sizeSelect.value);
      nextTarget = 1;
      lastDoneCell = null;
      startAt = 0;
      canClick = false;
      timeText.textContent = "计时：0.00 秒";
      loadRecords();
      updateRecordText();

      if (regenerate || numbers.length !== size * size) {
        buildNumbers();
      }
      renderGrid();
      startCountDown();
    }

    sizeSelect.addEventListener("change", () => initRound(true));
    newBtn.addEventListener("click", () => initRound(true));
    restartBtn.addEventListener("click", () => initRound(false));
    showRecordsBtn.addEventListener("click", openRecordsOverlay);
    clearRecordsBtn.addEventListener("click", () => {
      records = [];
      saveRecords();
      updateRecordText();
      if (recordsOverlay.classList.contains("show")) {
        openRecordsOverlay();
      }
    });
    closeRecordsBtn.addEventListener("click", closeRecordsOverlay);
    recordsOverlay.addEventListener("click", (e) => {
      if (e.target === recordsOverlay) {
        closeRecordsOverlay();
      }
    });

    initRound(true);
  </script>
</body>
</html>
